{"name":"Build APK","on":{"workflow_dispatch":null,"push":{"branches":["main"]}},"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-node@v4","with":{"node-version":20}},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":17}},{"name":"Create Android project","run":"mkdir www\ncp index.html www/index.html\nnpm init -y\nnpm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6\nnpx cap init \"برنامجي الأسبوعي\" com.example.weeklyprogram --web-dir www\nnpx cap add android\nif [ -f icon.png ]; then\n  mkdir assets\n  cp icon.png assets/icon-only.png\n  cp icon.png assets/icon-foreground.png\n  cp icon.png assets/icon-background.png\n  npm i @capacitor/assets@3\n  npx capacitor-assets generate --android --iconBackgroundColor '#14202b' --iconBackgroundColorDark '#14202b'\nfi\nnpx cap sync android\n"},{"name":"Build APK","run":"cd android\nchmod +x gradlew\n./gradlew assembleDebug\n"},{"uses":"actions/upload-artifact@v4","with":{"name":"weekly-program-apk","path":"android/app/build/outputs/apk/debug/app-debug.apk"}}]}}}
