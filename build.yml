name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android project
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "برنامجي الأسبوعي" com.example.weeklyprogram --web-dir www
          npx cap add android
          if [ -f icon.png ]; then
            mkdir assets
            cp icon.png assets/icon-only.png
            cp icon.png assets/icon-foreground.png
            npm i @capacitor/assets@3
            npx capacitor-assets generate --android --iconBackgroundColor '#14202b' --iconBackgroundColorDark '#14202b'
          fi
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: weekly-program-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
